name: Update publications from ORCID

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch publications from ORCID
        run: |
          python <<'PY'
          import json
          import urllib.request
          import os

          orcid_id = "0000-0002-5147-7357"
          url = f"https://pub.orcid.org/v3.0/{orcid_id}/works"

          headers = {
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          }

          request = urllib.request.Request(url, headers=headers)

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          publications = []

          for group in data.get("group", []):
              summaries = group.get("work-summary", [])

              if not summaries:
                  continue

              work = summaries[0]

              publication_date = work.get("publication-date") or {}
              year_data = publication_date.get("year") or {}
              year = year_data.get("value")

              if not year:
                  continue

              try:
                  year_int = int(year)
              except (TypeError, ValueError):
                  continue

              if year_int < 2020:
                  continue

              title_data = work.get("title") or {}
              title_obj = title_data.get("title") or {}
              title = title_obj.get("value", "Untitled")

              journal_data = work.get("journal-title") or {}
              journal = journal_data.get("value", "")

              doi = ""

              external_ids = work.get("external-ids") or {}
              external_id_list = external_ids.get("external-id", [])

              for external_id in external_id_list:
                  if external_id.get("external-id-type", "").lower() == "doi":
                      doi_value = external_id.get("external-id-value", "")
                      doi_url = (external_id.get("external-id-url") or {}).get("value", "")

                      if doi_url:
                          doi = doi_url
                      elif doi_value:
                          doi = f"https://doi.org/{doi_value}"

                      break

              publications.append({
                  "title": title,
                  "year": year_int,
                  "journal": journal,
                  "doi": doi
              })

          publications.sort(
              key=lambda item: item["year"],
              reverse=True
          )

          os.makedirs("_data", exist_ok=True)

          with open("_data/publications.json", "w", encoding="utf-8") as file:
              json.dump(
                  publications,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Updated {len(publications)} publications.")
          PY

      - name: Commit updated publications
        id: commit_step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _data/publications.json

          if git diff --cached --quiet; then
            echo "No changes to publications."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update publications from ORCID"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger GitHub Pages rebuild
        if: steps.commit_step.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
