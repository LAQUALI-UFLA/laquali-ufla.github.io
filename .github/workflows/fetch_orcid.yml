name: Update ORCID and Deploy Site

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch publications from ORCID
        run: |
          python <<'PY'
          import json
          import urllib.request
          import os

          orcid_id = "0000-0002-5147-7357"
          url = f"https://pub.orcid.org/v3.0/{orcid_id}/works"

          headers = {
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          }

          request = urllib.request.Request(url, headers=headers)

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          publications = []

          for group in data.get("group", []):
              summaries = group.get("work-summary", [])
              if not summaries:
                  continue

              work = summaries[0]
              pub_date = work.get("publication-date") or {}
              year = (pub_date.get("year") or {}).get("value")

              if not year:
                  continue

              try:
                  year_int = int(year)
              except (TypeError, ValueError):
                  continue

              if year_int < 2020:
                  continue

              title = ((work.get("title") or {}).get("title") or {}).get("value", "Untitled")
              journal = (work.get("journal-title") or {}).get("value", "")

              doi = ""
              ext_ids = (work.get("external-ids") or {}).get("external-id", [])
              for ext in ext_ids:
                  if ext.get("external-id-type", "").lower() == "doi":
                      doi_url = (ext.get("external-id-url") or {}).get("value", "")
                      doi_val = ext.get("external-id-value", "")
                      doi = doi_url if doi_url else (f"https://doi.org/{doi_val}" if doi_val else "")
                      break

              publications.append({
                  "title": title,
                  "year": year_int,
                  "journal": journal,
                  "doi": doi
              })

          publications.sort(key=lambda item: item["year"], reverse=True)

          os.makedirs("_data", exist_ok=True)
          with open("_data/publications.json", "w", encoding="utf-8") as f:
              json.dump(publications, f, ensure_ascii=False, indent=2)

          print(f"Updated {len(publications)} publications.")
          PY

      - name: Commit updated JSON to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: update ORCID publications"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
