name: Update ORCID Publications

on:
  schedule:
    - cron: '0 0 * * *'  # Executa diariamente à meia-noite (UTC)
  workflow_dispatch:      # Permite rodar manualmente a qualquer momento

jobs:
  update-orcid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and update ORCID data
        run: |
          python -c "
          import urllib.request
          import json
          import os

          orcid_id = '0000-0002-5147-7357'
          url = f'https://pub.orcid.org/v3.0/{orcid_id}/works'
          
          headers = {
              'Accept': 'application/json',
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          }
          req = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode('utf-8'))
              
              works = [g['work-summary'][0] for g in data.get('group', [])]
              recent_works = []

              for w in works:
                  pub_date = w.get('publication-date')
                  year_str = pub_date.get('year', {}).get('value') if pub_date else None
                  
                  if year_str and int(year_str) >= 2020:
                      title = w.get('title', {}).get('title', {}).get('value', 'Untitled')
                      journal = w.get('journal-title', {}).get('value', '') if w.get('journal-title') else ''
                      
                      doi_url = ''
                      ext_ids = w.get('external-ids', {}).get('external-id', [])
                      for ext_id in ext_ids:
                          if ext_id.get('external-id-type', '').lower() == 'doi':
                              doi_url = ext_id.get('external-id-url', {}).get('value', '')
                              ext_val = ext_id.get('external-id-value', '')
                              if not doi_url and ext_val:
                                  doi_url = 'https://doi.org/' + str(ext_val)
                              break
                      
                      recent_works.append({
                          'title': title,
                          'year': year_str,
                          'journal': journal,
                          'doi': doi_url
                      })

              recent_works.sort(key=lambda x: int(x['year']), reverse=True)

              os.makedirs('_data', exist_ok=True)
              with open('_data/publications.json', 'w', encoding='utf-8') as f:
                  json.dump(recent_works, f, ensure_ascii=False, indent=2)

              print(f'Successfully saved {len(recent_works)} publications.')

          except Exception as e:
              print(f'Error fetching ORCID data: {e}')
              raise e
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update ORCID publications" && git push)
